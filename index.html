<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Tic Tac Two</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#192437;--line:#34445e;--muted:#91a0b7;--text:#f4f7fc;--blue:#69b7ff;--orange:#ffad66}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#233451 0%,var(--bg) 58%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:28px 14px}main{width:min(100%,560px);margin:auto}header{text-align:center;margin-bottom:22px}.eyebrow{color:var(--muted);font-size:.75rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase}h1{font-size:clamp(2rem,8vw,3rem);letter-spacing:-.055em;margin:7px 0 5px}.subtitle{color:var(--muted);margin:0;font-size:.95rem}.panel{background:linear-gradient(160deg,rgba(31,46,68,.97),rgba(23,35,53,.97));border:1px solid rgba(157,180,218,.16);border-radius:24px;padding:clamp(14px,4vw,24px);box-shadow:0 24px 70px #0005}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.turn{font-weight:750;font-size:.95rem;display:flex;align-items:center;gap:9px}.dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 14px currentColor}.turn.o .dot{background:var(--orange)}.turn.done .dot{background:#9ca9bb}button{font:inherit}.actions{display:flex;align-items:center;gap:8px}.actions select{max-width:118px;border:1px solid var(--line);background:#263750;color:var(--text);padding:9px 8px;border-radius:11px;font:inherit;font-weight:700}.reset{border:1px solid var(--line);background:#263750;color:var(--text);padding:9px 13px;border-radius:11px;font-weight:700;cursor:pointer;transition:background .15s,transform .15s}.reset:hover{background:#314662}.reset:active{transform:scale(.97)}.board-wrap{width:100%;max-width:430px;margin:0 auto;aspect-ratio:1;display:grid;place-items:center}.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));gap:clamp(3px,1vw,6px)}.cell{min-width:0;min-height:0;border-radius:clamp(5px,1.6vw,11px);display:grid;place-items:center;font-weight:900;font-size:clamp(1rem,5.2vw,2rem);line-height:1;user-select:none}.cell.playable{border:1px solid #3a4d69;background:linear-gradient(145deg,#293b56,#202f46);cursor:pointer;transition:border-color .12s,background .12s,transform .12s}.cell.playable:hover:empty{background:#304563;border-color:#6682aa}.cell.playable:active{transform:scale(.94)}.cell.edge{border:1px dashed rgba(133,153,184,.18);background:rgba(17,28,44,.18);color:var(--orange);pointer-events:none}.cell.x{color:var(--blue);text-shadow:0 0 18px #69b7ff35}.cell.o{color:var(--orange);text-shadow:0 0 18px #ffad6635}.cell.winning{border-color:#a7b6ff;background:#35476a;box-shadow:0 0 0 2px #a7b6ff35,0 0 20px #8c9cff30}.legend{display:flex;justify-content:center;gap:22px;color:var(--muted);font-size:.85rem;margin:15px 0 18px}.legend span{display:flex;align-items:center;gap:7px}.legend b{font-size:1.1rem}.legend .xmark{color:var(--blue)}.legend .omark{color:var(--orange)}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.score{background:#111d2e80;border:1px solid #34445e80;border-radius:14px;text-align:center;padding:11px 5px}.score strong{display:block;font-size:1.45rem;line-height:1.3}.score span{font-size:.72rem;color:var(--muted);font-weight:750;letter-spacing:.08em;text-transform:uppercase}footer{color:#71819b;text-align:center;font-size:.75rem;margin-top:15px}@media(max-width:390px){body{padding:18px 9px}.panel{padding:12px;border-radius:19px}.board{gap:3px}.scores{gap:6px}.score{padding:9px 3px}}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">A little twist on a classic</div><h1>Tic Tac Two</h1><p class="subtitle">Three in a row wins. You're X.</p></header>
<section class="panel" aria-label="Tic Tac Two game">
<div class="topline"><div class="turn" id="turn"><i class="dot"></i><span id="status" aria-live="polite">Your turn</span></div><div class="actions"><select id="mode" aria-label="Board size"><option value="3">3 × 3</option><option value="5" selected>5 × 5</option></select><select id="difficulty" aria-label="Difficulty"><option value="easy">Easy</option><option value="hard">Hard</option><option value="impossible" selected>Impossible</option></select><button class="reset" id="newGame" type="button">New game ↻</button></div></div>
<div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Game board"></div></div>
<div class="legend"><span><b class="xmark">X</b> You</span><span><b class="omark">O</b> Computer</span></div>
<div class="scores"><div class="score"><strong id="xWins">0</strong><span>Your wins</span></div><div class="score"><strong id="draws">0</strong><span>Draws</span></div><div class="score"><strong id="oWins">0</strong><span>Computer wins</span></div></div>
</section><footer id="rules">5 × 5 board · 3 in a row</footer>
</main>
<script>
(() => {
"use strict";
const boardEl=document.getElementById("board"),statusEl=document.getElementById("status"),turnEl=document.getElementById("turn");
const difficultyEl=document.getElementById("difficulty"),modeEl=document.getElementById("mode"),rulesEl=document.getElementById("rules");
const scoreEls={X:document.getElementById("xWins"),O:document.getElementById("oWins"),D:document.getElementById("draws")};
let size=7,min=1,max=5,playSize=5,cells=[],finished=false,scores={X:0,O:0,D:0},winningLine=[],lines=[],interiorIndices=[],allIndices=[],compactIndex=new Map(),winMasks=[],fullMask=0,centerOrder=[],perfectCache=new Map();
const index=(r,c)=>r*size+c,inside=(r,c)=>r>=min&&r<=max&&c>=min&&c<=max;
function configure(){playSize=Number(modeEl.value);size=playSize===3?5:7;min=1;max=playSize===3?3:5;cells=Array(size*size).fill("");allIndices=Array.from({length:size*size},(_,i)=>i);lines=[];for(let r=0;r<size;r++)for(let c=0;c<size;c++)for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const r2=r+2*dr,c2=c+2*dc;if(r2>=0&&r2<size&&c2>=0&&c2<size)lines.push([index(r,c),index(r+dr,c+dc),index(r2,c2)]);}interiorIndices=[];for(let r=min;r<=max;r++)for(let c=min;c<=max;c++)interiorIndices.push(index(r,c));compactIndex=new Map(interiorIndices.map((v,i)=>[v,i]));winMasks=lines.filter(line=>line.every(i=>compactIndex.has(i))).map(line=>line.reduce((mask,i)=>mask|(1<<compactIndex.get(i)),0));fullMask=(1<<interiorIndices.length)-1;perfectCache=new Map();centerOrder=Array.from({length:interiorIndices.length},(_,i)=>i).sort((a,b)=>{const ar=Math.floor(a/playSize),ac=a%playSize,br=Math.floor(b/playSize),bc=b%playSize;return Math.abs(ar-(playSize-1)/2)+Math.abs(ac-(playSize-1)/2)-Math.abs(br-(playSize-1)/2)-Math.abs(bc-(playSize-1)/2);});boardEl.style.gridTemplateColumns='repeat('+size+',minmax(0,1fr))';boardEl.style.gridTemplateRows='repeat('+size+',minmax(0,1fr))';rulesEl.textContent=playSize+' × '+playSize+' board · 3 in a row';}
function findWin(state,mark){for(const line of lines)if(line.every(i=>state[i]===mark))return line;return null;}
function emptyInterior(state){return interiorIndices.filter(i=>!state[i]);}
function emptyComputer(state){return (playSize===3?allIndices:interiorIndices).filter(i=>!state[i]);}
function cheatingComputerMove(){const available=emptyComputer(cells);for(const i of available){cells[i]="O";const won=!!findWin(cells,"O");cells[i]="";if(won)return i;}const urgent=winningMoves(cells,"X");if(urgent.length){for(const i of available){cells[i]="O";const blocks=urgent.every(t=>{if(cells[t])return true;cells[t]="X";const win=!!findWin(cells,"X");cells[t]="";return !win;});cells[i]="";if(blocks)return i;}}let best=available[0]??-1,bestScore=-Infinity;for(const i of available){cells[i]="O";let score=0;for(const line of lines){if(!line.includes(i))continue;let o=0,x=0;for(const j of line){if(cells[j]==="O")o++;else if(cells[j]==="X")x++;}if(x===0)score+=o===2?20000:o===1?900:30;else if(o===0&&x===2)score-=18000;}let oThreats=0;for(const j of allIndices){if(cells[j])continue;cells[j]="O";if(findWin(cells,"O"))oThreats++;cells[j]="";}let xThreats=0;for(const j of interiorIndices){if(cells[j])continue;cells[j]="X";if(findWin(cells,"X"))xThreats++;cells[j]="";}let worstFork=0;for(const j of interiorIndices){if(cells[j])continue;cells[j]="X";let forks=0;for(const k of interiorIndices){if(cells[k])continue;cells[k]="X";if(findWin(cells,"X"))forks++;cells[k]="";}worstFork=Math.max(worstFork,forks);cells[j]="";}score+=oThreats*7000-xThreats*6000-worstFork*8500;if(!interiorIndices.includes(i))score+=250;else{const r=Math.floor(i/size),col=i%size;score+=(2-Math.abs(r-2))+(2-Math.abs(col-2));}cells[i]="";if(score>bestScore){bestScore=score;best=i;}}return best;}
function maskWins(mask){for(const line of winMasks)if((mask&line)===line)return true;return false;}
function solvePerfect(xMask,oMask,turn){if(maskWins(oMask))return 1;if(maskWins(xMask))return -1;const occupied=xMask|oMask;if(occupied===fullMask)return 0;const key=xMask+","+oMask+","+turn,cached=perfectCache.get(key);if(cached!==undefined)return cached;let best=turn==="O"?-2:2;for(const i of centerOrder){const bit=1<<i;if(occupied&bit)continue;const value=turn==="O"?solvePerfect(xMask,oMask|bit,"X"):solvePerfect(xMask|bit,oMask,"O");if(turn==="O"){if(value>best)best=value;if(best===1)break;}else{if(value<best)best=value;if(best===-1)break;}}perfectCache.set(key,best);return best;}
function perfectComputerMove(){let xMask=0,oMask=0;for(let i=0;i<interiorIndices.length;i++){const mark=cells[interiorIndices[i]];if(mark==="X")xMask|=1<<i;else if(mark==="O")oMask|=1<<i;}let best=-2,bestMove=-1,occupied=xMask|oMask;for(const i of centerOrder){const bit=1<<i;if(occupied&bit)continue;const value=solvePerfect(xMask,oMask|bit,"X");if(value>best){best=value;bestMove=interiorIndices[i];}if(best===1)break;}return bestMove;}
function winningMoves(state,mark){const found=[];for(const i of emptyInterior(state)){state[i]=mark;const win=!!findWin(state,mark);state[i]="";if(win)found.push(i);}return found;}
function candidateMoves(state){const empty=emptyInterior(state);if(playSize===3||empty.length<=8)return empty;const near=new Set();for(const i of empty){const r=Math.floor(i/size),c=i%size;let close=false;for(let dr=-1;dr<=1&&!close;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(inside(rr,cc)&&state[index(rr,cc)]){close=true;break;}}if(close)near.add(i);}if(!near.size)near.add(index(3,3));return [...near];}
function evaluate(state){const winsO=winningMoves(state,"O").length,winsX=winningMoves(state,"X").length;if(winsO)return 900000+winsO*1000;if(winsX)return -950000-winsX*1000;let total=0;for(const line of lines){let o=0,x=0;for(const i of line){if(state[i]==="O")o++;else if(state[i]==="X")x++;}if(o&&x)continue;if(o)total+=o===2?420:o===1?28:0;else if(x)total-=x===2?520:x===1?32:0;}return total;}
function orderedMoves(state,mark){return candidateMoves(state).map(i=>{state[i]=mark;const score=evaluate(state);state[i]="";return {i,score:mark==="O"?score:-score};}).sort((a,b)=>b.score-a.score).map(x=>x.i);}
function search(state,depth,alpha,beta,turn){if(findWin(state,"O"))return 100000+depth;if(findWin(state,"X"))return -100000-depth;if(depth===0||!emptyInterior(state).length)return evaluate(state);const moves=orderedMoves(state,turn).slice(0,playSize===3?9:(depth>=3?10:12));if(turn==="O"){let best=-Infinity;for(const i of moves){state[i]="O";const value=search(state,depth-1,alpha,beta,"X");state[i]="";best=Math.max(best,value);alpha=Math.max(alpha,best);if(beta<=alpha)break;}return best;}let best=Infinity;for(const i of moves){state[i]="X";const value=search(state,depth-1,alpha,beta,"O");state[i]="";best=Math.min(best,value);beta=Math.min(beta,best);if(beta<=alpha)break;}return best;}
function chooseComputerMove(){const moves=emptyInterior(cells);if(!moves.length)return -1;if(playSize===3)return cheatingComputerMove();if(difficultyEl.value==="impossible")return perfectComputerMove();const wins=winningMoves(cells,"O");if(wins.length)return wins[0];const threats=winningMoves(cells,"X");if(threats.length===1)return threats[0];if(difficultyEl.value==="easy"){const choices=candidateMoves(cells);return choices[Math.floor(Math.random()*choices.length)]??moves[0];}const depth=playSize===3?moves.length:(difficultyEl.value==="hard"?4:4);const ranked=orderedMoves(cells,"O");let best=ranked[0],bestScore=-Infinity,alpha=-Infinity;for(const i of ranked){cells[i]="O";const score=search(cells,depth-1,alpha,Infinity,"X");cells[i]="";if(score>bestScore){bestScore=score;best=i;}alpha=Math.max(alpha,bestScore);}return best;}
function render(){boardEl.innerHTML="";for(let r=0;r<size;r++)for(let c=0;c<size;c++){const i=index(r,c),mark=cells[i],playable=interiorIndices.includes(i),el=document.createElement(playable?"button":"div");el.className="cell "+(playable?"playable":"edge")+(mark?" "+mark.toLowerCase():"")+(winningLine.includes(i)?" winning":"");if(playable){el.type="button";el.setAttribute("role","gridcell");el.setAttribute("aria-label","Row "+(r+1)+", column "+(c+1)+": "+(mark||"empty"));el.disabled=!!mark||finished;el.addEventListener("click",()=>play(i));}else el.setAttribute("aria-hidden","true");el.textContent=mark;boardEl.appendChild(el);}Object.keys(scores).forEach(k=>scoreEls[k].textContent=scores[k]);}
function setStatus(message,mark){statusEl.textContent=message;turnEl.className="turn"+(mark==="O"?" o":finished?" done":"");}
function endGame(winner,line){finished=true;winningLine=line||[];if(winner==="X"){scores.X++;setStatus("You win!");}else if(winner==="O"){scores.O++;setStatus("Computer wins");}else{scores.D++;setStatus("It's a draw");}render();}
function computerTurn(){if(finished)return;setStatus("Computer is thinking…","O");render();window.setTimeout(()=>{if(finished)return;const move=chooseComputerMove();if(move<0){endGame("D");return;}cells[move]="O";const line=findWin(cells,"O");if(line){endGame("O",line);return;}if(!emptyInterior(cells).length){endGame("D");return;}setStatus("Your turn","X");render();},180);}
function play(i){if(finished||cells[i]||!interiorIndices.includes(i))return;cells[i]="X";const line=findWin(cells,"X");if(line){endGame("X",line);return;}if(!emptyInterior(cells).length){endGame("D");return;}computerTurn();}
function newGame(){cells=Array(size*size).fill("");finished=false;winningLine=[];setStatus("Computer opens…","O");render();computerTurn();}
document.getElementById("newGame").addEventListener("click",newGame);
difficultyEl.addEventListener("change",newGame);
modeEl.addEventListener("change",()=>{configure();newGame();});
configure();newGame();
})();
</script>
</body>
</html>
